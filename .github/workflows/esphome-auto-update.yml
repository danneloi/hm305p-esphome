# Checks once a week for a new ESPHome version.
# If there is one, the web UI firmware (EN + DE) is rebuilt with it and
# published as a PRE-RELEASE. Test it, then mark it as "latest release".
# Can also be started manually: Actions → ESPHome auto update → Run workflow.
name: ESPHome auto update

on:
  schedule:
    - cron: "17 4 * * 1"        # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      esphome: ${{ steps.check.outputs.esphome }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ESPHOME=$(curl -fsSL https://pypi.org/pypi/esphome/json | jq -r .info.version)
          echo "Latest ESPHome: $ESPHOME"
          TAGS=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName')
          if echo "$TAGS" | grep -q -- "-esphome\.${ESPHOME}$"; then
            echo "Already built for ESPHome $ESPHOME – nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          BASE=${BASE%%-esphome.*}
          [ -z "$BASE" ] && BASE=v1.0.0
          echo "build=true"                         >> "$GITHUB_OUTPUT"
          echo "esphome=$ESPHOME"                   >> "$GITHUB_OUTPUT"
          echo "tag=${BASE}-esphome.${ESPHOME}"     >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: hm305p-esp32c3-webui.yaml
            out: hm305p-webui-en
          - file: hm305p-esp32c3-webui.de.yaml
            out: hm305p-webui-de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome ${{ needs.check.outputs.esphome }}
        run: pip install "esphome==${{ needs.check.outputs.esphome }}"
      - name: Validate config
        run: esphome config ${{ matrix.file }}
      - name: Compile
        run: esphome compile ${{ matrix.file }}
      - name: Collect binaries
        run: |
          mkdir -p dist
          cp .esphome/build/hm305p/build/firmware.factory.bin dist/${{ matrix.out }}.factory.bin
          cp .esphome/build/hm305p/build/firmware.ota.bin     dist/${{ matrix.out }}.ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/*.bin

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          ESPHOME: ${{ needs.check.outputs.esphome }}
        run: |
          cat > notes.md <<NOTES
          **Automatic build with ESPHome ${ESPHOME}** – not tested on hardware yet.
          **Automatischer Build mit ESPHome ${ESPHOME}** – noch nicht auf echter Hardware getestet.

          Same configuration as the latest release, only rebuilt with the new ESPHome version.
          Gleiche Konfiguration wie das letzte Release, nur mit der neuen ESPHome-Version gebaut.

          | File / Datei | Use / Zweck |
          |---|---|
          | \`*.factory.bin\` | First flash via USB (web.esphome.io) / Erstes Flashen per USB |
          | \`*.ota.bin\` | Update via web page / Update über die Webseite |
          NOTES
          gh release create "$TAG" dist/*.bin -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "$TAG (ESPHome $ESPHOME, pre-release)" --notes-file notes.md
