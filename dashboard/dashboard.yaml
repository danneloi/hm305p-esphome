# Home Assistant dashboard for the HM305P (ESPHome device "bench-psu")
# Add: Settings → Dashboards → Add dashboard → "New dashboard from scratch"
#      → ⋮ → Edit → ⋮ → Raw configuration editor → replace everything.
# Built-in cards only, no HACS required.
# Different device name? Search & replace "bench_psu".
title: Bench PSU
views:
  - title: Bench PSU
    path: bench-psu
    icon: mdi:power-plug-battery
    type: sections
    max_columns: 3
    sections:
      # ---------- Live-Werte ----------
      - type: grid
        cards:
          - type: heading
            heading: Live values
            icon: mdi:gauge
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.bench_psu_protection_status
                state_not:
                  - OK
                  - unknown
                  - unavailable
                  - unknown
            card:
              type: markdown
              content: >-
                ## ⚠️ Protection tripped: {{ states('sensor.bench_psu_protection_status') }}

                Output was switched off. Check the cause, then turn the output back on.
          - type: gauge
            entity: sensor.bench_psu_voltage
            name: Voltage
            min: 0
            max: 30
            needle: true
            grid_options: { columns: 4 }
          - type: gauge
            entity: sensor.bench_psu_current
            name: Current
            min: 0
            max: 5
            needle: true
            grid_options: { columns: 4 }
          - type: gauge
            entity: sensor.bench_psu_power
            name: Power
            min: 0
            max: 150
            needle: true
            grid_options: { columns: 4 }
          - type: tile
            entity: switch.bench_psu_output
            name: Output
            icon: mdi:power
            color: green
            features_position: inline
            features:
              - type: toggle
            grid_options: { columns: 12 }
          - type: tile
            entity: sensor.bench_psu_operating_mode
            name: Operating mode
            icon: mdi:sine-wave
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.bench_psu_protection_status
            name: Protection status
            icon: mdi:shield-check
            grid_options: { columns: 6 }

      # ---------- Einstellungen ----------
      - type: grid
        cards:
          - type: heading
            heading: Settings
            icon: mdi:tune-vertical
          - type: tile
            entity: number.bench_psu_set_voltage
            name: Set voltage
            icon: mdi:flash-triangle
            color: amber
            features:
              - type: numeric-input
                style: buttons
            grid_options: { columns: 6 }
          - type: tile
            entity: number.bench_psu_current_limit
            name: Current limit
            icon: mdi:current-dc
            color: blue
            features:
              - type: numeric-input
                style: buttons
            grid_options: { columns: 6 }
          - type: tile
            entity: number.bench_psu_ovp_limit
            name: OVP (over-voltage)
            icon: mdi:shield-alert
            color: red
            features:
              - type: numeric-input
                style: buttons
            grid_options: { columns: 6 }
          - type: tile
            entity: number.bench_psu_ocp_limit
            name: OCP (over-current)
            icon: mdi:shield-alert
            color: red
            features:
              - type: numeric-input
                style: buttons
            grid_options: { columns: 6 }
          - type: markdown
            content: >-
              <small>Change the voltage with the **output off** if possible –
              the HM305P dips briefly when switching under load.</small>

      # ---------- Presets ----------
      - type: grid
        cards:
          - type: heading
            heading: Presets
            icon: mdi:flash
          - type: markdown
            content: >-
              <small>Each preset turns the output **off** and sets OVP, OCP,
              current and voltage. Turn the output on yourself afterwards.</small>
          - type: button
            entity: button.bench_psu_preset_3_3_v_0_5_a
            name: 3.3 V · 0.5 A
            icon: mdi:chip
            tap_action: { action: toggle }
            grid_options: { columns: 4, rows: 2 }
          - type: button
            entity: button.bench_psu_preset_5_v_1_a
            name: 5 V · 1 A
            icon: mdi:usb
            tap_action: { action: toggle }
            grid_options: { columns: 4, rows: 2 }
          - type: button
            entity: button.bench_psu_preset_12_v_2_a
            name: 12 V · 2 A
            icon: mdi:car-battery
            tap_action: { action: toggle }
            grid_options: { columns: 4, rows: 2 }
          - type: button
            entity: button.bench_psu_preset_20_v_2_a
            name: 20 V · 2 A
            icon: mdi:laptop
            tap_action: { action: toggle }
            grid_options: { columns: 6, rows: 2 }
          - type: button
            entity: button.bench_psu_short_hunting_1_v_1_a
            name: Short hunting
            icon: mdi:magnify-scan
            tap_action: { action: toggle }
            grid_options: { columns: 6, rows: 2 }
          - type: heading
            heading: Device memory
            heading_style: subtitle
          - type: button
            entity: button.bench_psu_load_m1
            name: M1
            show_icon: false
            tap_action: { action: toggle }
            grid_options: { columns: 2, rows: 1 }
          - type: button
            entity: button.bench_psu_load_m2
            name: M2
            show_icon: false
            tap_action: { action: toggle }
            grid_options: { columns: 2, rows: 1 }
          - type: button
            entity: button.bench_psu_load_m3
            name: M3
            show_icon: false
            tap_action: { action: toggle }
            grid_options: { columns: 2, rows: 1 }
          - type: button
            entity: button.bench_psu_load_m4
            name: M4
            show_icon: false
            tap_action: { action: toggle }
            grid_options: { columns: 2, rows: 1 }
          - type: button
            entity: button.bench_psu_load_m5
            name: M5
            show_icon: false
            tap_action: { action: toggle }
            grid_options: { columns: 2, rows: 1 }
          - type: button
            entity: button.bench_psu_load_m6
            name: M6
            show_icon: false
            tap_action: { action: toggle }
            grid_options: { columns: 2, rows: 1 }

      # ---------- Verlauf ----------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: History (last hour)
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 1
            entities:
              - entity: sensor.bench_psu_voltage
                name: Voltage
              - entity: number.bench_psu_set_voltage
                name: Set voltage
          - type: history-graph
            hours_to_show: 1
            entities:
              - entity: sensor.bench_psu_current
                name: Current
              - entity: number.bench_psu_current_limit
                name: Current limit
          - type: history-graph
            hours_to_show: 1
            entities:
              - entity: sensor.bench_psu_power
                name: Power

      # ---------- Gerät ----------
      - type: grid
        cards:
          - type: heading
            heading: Device
            icon: mdi:information-outline
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.bench_psu_key_beep
                name: Key beep
              - entity: sensor.bench_psu_opp_limit
                name: OPP (over-power)
              - entity: sensor.bench_psu_model_id
                name: Model ID
              - entity: sensor.bench_psu_wifi_signal
                name: WiFi signal
